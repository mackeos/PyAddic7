# Publishes pyaddic7ed to PyPI via Trusted Publishing (OIDC, no API token stored).
#
# One-time setup on PyPI (owner):
#   1. On pypi.org, create/claim the project "pyaddic7ed" (or prepare a pending
#      publisher entry).
#   2. Add a Trusted Publisher: GitHub owner=Mackeos, repo=pyaddic7ed,
#      workflow=.github/workflows/publish.yml, environment= (leave empty).
#
# Then creating a GitHub release in the public repo publishes dist/* to PyPI.
# No secrets are stored in this repository (workflow constraint D30).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
